{% extends "base.html" %}
{% block content %}
<h2>登录</h2>
{% if form.errors %}<p class="error">用户名或密码错误</p>{% endif %}
<form method="post">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  <p><label>用户名</label><input name="username"></p>
  <p><label>密码</label><input name="password" type="password"></p>
  <button type="submit">登录</button>
</form>
{% endblock %}
